<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>simple card design</title>
    <style>
        /* @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap'); */
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: grey;
            padding: 45px;
        }

        .card{
             background-color: white;
             width: 200px;
             /* height: 344px; */
             border-radius: 7px;
             padding: 0 0 34px 0;
             
        }

        .image{
            padding: 5px;
            border-radius: 7px;
            
        }

        .image img{
             border-radius: 7px;
            
        }

        .content{
            padding: 7px 13px;
            /*font-family: 'poppins', sans-serif; */
        }
        
        .content p{
            font-size: 13px; 
            color: gray;  
        }

        .capsules{
            padding: 0 28px 0 14px;
        }

        .capsules span{
            border: 1px solid gray; 
            padding: 0px 6px;
            border-radius: 7px;
            font-size: 11px;
            /* font-family: 'poppins', sans-serif; */ */

        }

        .button{
            text-align: center;
        }

        .button button{
            padding: 7px 15px;
            border-radius: 15px; 
            background-color: rgb(216, 236, 253);
            color: rgb(14, 150, 234);
            font-size: 12px;
            margin-top: 7px;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }

        .button button:hover{
            background-color: rgb(194, 225,246);
            color: rgb(10, 136, 214);
        
        }
    </style>
</head>

<body>
    <!-- card.png is a file which contains a card Image. Write html and css code to design this card -->
     <div class="card">

        <div class="image">
            <img width="188" src="https://s7ap1.scene7.com/is/image/incredibleindia/vagator-beach-goa-city-1-hero?qlt=82&ts=1742158909874" alt="">
        </div>
         
        <div class="capsules">
            <span>Nature</span>
            <span>Beach</span>
        </div>
        <div class="content">
            <h1>Goa Beach</h1>
            <p>Goa's beaches are globally renowned for their golden sands, vibrant culture, and distinct experiences divided between the bustling North and the tranquil South. </p>
        </div>
        <div class="button">
        <button>Read More</button>
     </div>
     </div>
     
    
</body>

</html>
